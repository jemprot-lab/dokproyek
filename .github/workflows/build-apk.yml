name: Build Signed Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-apk-uploader/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > mobile-apk-uploader/dokproyek-release.jks
            echo "KEYSTORE_GENERATED=false" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore mobile-apk-uploader/dokproyek-release.jks \
              -alias dokproyek \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "DokProyek2026!" \
              -keypass "DokProyek2026!" \
              -dname "CN=DokProyek, OU=Field, O=Kontraktor, L=Sragen, S=Jateng, C=ID"
            echo "KEYSTORE_GENERATED=true" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        working-directory: mobile-apk-uploader
        env:
          KEYSTORE_FILE: dokproyek-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'DokProyek2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dokproyek' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'DokProyek2026!' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokproyek-apk
          path: mobile-apk-uploader/build/outputs/apk/release/*.apk

      - name: Upload Keystore (First Run Only)
        if: env.KEYSTORE_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dokproyek-keystore
          path: mobile-apk-uploader/dokproyek-release.jks
          retention-days: 1
